name: Learn GH Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
  workflow_dispatch: 

permissions: 
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/WeatherApi.Tests/packages.lock.json
      
      - name: Restore dependecies
        run: dotnet restore gh-actions.sln --locked-mode

      - name: Build the application and tests
        run: dotnet build gh-actions.sln --configuration "$BUILD_CONFIGURATION" --no-restore
      
      - name: Run tests
        id: tests
        run: dotnet test tests/WeatherApi.Tests/WeatherApi.Tests.csproj --configuration "$BUILD_CONFIGURATION" --no-build --logger trx --results-directory TestResults
      
      - name: Upload test
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped'}}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: warn
      
      - name: Explain test failure
        if: ${{ failure() && steps.tests.outcome == 'failure'}}
        run: echo "Tests failed. Inspect the Run tests log and download the test-results artifact."

  package:
    name: Package the API
    needs: build
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      
      - name: Restore application dependencies
        run: dotnet restore gh-actions.csproj --locked-mode

      - name: Publish the application
        run: >
          dotnet publish gh-actions.csproj
          --configuration "$BUILD_CONFIGURATION"
          --no-restore
          --no-self-contained
          --output "${{ runner.temp }}/weather-api"
      
      - name: Generate package metadata
        id: metadata
        run: echo "artifact_name=weather-api-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Uplodad app package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}//weather-api/
          retention-days: 7
          if-no-files-found: error

  report:
    name: Inspect application package
    needs: package
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download app package
        uses: actions/download-artifact@v8
        with:
          name:  ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp}}/downloaded-api
      - name: Inspect files
        env: 
          PACKAGE_DIRECTORY: ${{ runner.temp }}/downloaded-api
        run: |
          ls -lah "$PACKAGE_DIRECTORY"
          test -s "$PACKAGE_DIRECTORY/gh-actions.dll"
          test -s "$PACKAGE_DIRECTORY/gh-actions.deps.json"
          test -s "$PACKAGE_DIRECTORY/gh-actions.runtimeconfig.json"

      - name: Smoke test published API
        timeout-minutes: 2
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/downloaded-api
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
        run: |
          cd "$PACKAGE_DIRECTORY"

          dotnet gh-actions.dll \
            --urls "http://127.0.0.1:5080" \
            > "$RUNNER_TEMP/weather-api.log" 2>&1 &

          app_pid=$!

          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            cat "$RUNNER_TEMP/weather-api.log"
          }

          trap cleanup EXIT

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 15 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 45 \
            --max-time 3 \
            --output "$RUNNER_TEMP/forecast.json" \
            "http://127.0.0.1:5080/weatherforecast"

          jq -e \
            'type == "array" and length == 5' \
            "$RUNNER_TEMP/forecast.json"

          echo "Published API smoke test passed."

      - name: Write workflow summary
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
        run: |
          {
            echo "### Application package"
            echo "- Published API started and passed its smoke test."
            echo ""
            echo "- Artifact: $ARTIFACT_NAME"
            echo "- Required application files are present."
          } >> "$GITHUB_STEP_SUMMARY"

