name: Learn GH Actions

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  build:
    name: Build the API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      
      - name: Show SDk info
        run: dotnet --info
      
      - name: Restore dependecies
        run: dotnet restore gh-actions.csproj

      - name: Build the app
        run: dotnet build gh-actions.csproj --configuration Release --no-restore