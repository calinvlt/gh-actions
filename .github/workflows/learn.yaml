name: Learn GH Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
  workflow_dispatch: 

permissions: 
  contents: read

jobs:
  build:
    name: Build the API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      
      - name: Restore dependecies
        run: dotnet restore gh-actions.sln

      - name: Build the application and tests
        run: dotnet build gh-actions.sln --configuration Release --no-restore
      
      - name: Run tests
        id: tests
        run: dotnet test tests/WeatherApi.Tests/WeatherApi.Tests.csproj --configuration Release --no-build --logger trx --results-directory TestResults
      
      - name: Upload test
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped'}}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: warn
      
      - name: Explain test failure
        if: ${{ failure() && steps.tests.outcome == 'failure'}}
        run: echo "Tests failed. Inspect the Run tests log and download the test-results artifact."
